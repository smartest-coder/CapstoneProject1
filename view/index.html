    <script>
        if (localStorage.getItem('userLoginState') === 'authenticated') {
            const loginMenuButton = document.querySelector('nav a[href="login.html"]');
            if (loginMenuButton) {
                loginMenuButton.textContent = "Sign Out";
                loginMenuButton.style.color = "#ffcc00"; // Beautiful royal gold indicator
                
                loginMenuButton.addEventListener('click', function(e) {
                    e.preventDefault();
                    localStorage.clear(); 
                    window.location.reload(); 
                });
            }
        }
    </script>
