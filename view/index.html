<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }
        header {
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('https://images.unsplash.com/photo-1477587458883-47145ed94245?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            padding: 80px 20px;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
        }
        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            transition: color 0.3s;
        }
        nav a:hover {
            color: #ffcc00;
        }
        .hero {
            color: #ffffff;
            font-size: 42px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        h1 {
            text-align: center;
            margin: 40px 20px 20px;
            color: #b58d3d;
        }
        footer {
            text-align: center;
            padding: 40px 20px;
            margin-top: 40px;
        }
        footer a {
            color: #333;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login / Sign up</a>

    <main id="cardDisplay"></main>

    <footer>
        <a href="contact.html">Contact us</a>
    </footer>

</body>
</html>
