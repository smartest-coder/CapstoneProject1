<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="/index.css">
</head>

<body>
    <header>
        <nav>
            <a href="/">Home</a>
            <a href="/about">About us</a>
        </nav>
        <div class="hero">Welcome to Rajasthan</div>
    </header>

    <h1>Choose your destination and click on guide button</h1>

    <main id="cardDisplay">
    </main>

    <footer>
        <a href="/contactUs">Contact us</a>
    </footer>
    
    <a href="/password/0" class="plus"><img src="plus.svg" alt=""></a>
    <script src="/index.js"></script>
    <script>
    // Fluent Integration Handler: Checks if the user logged in successfully
    if (localStorage.getItem('userLoginState') === 'authenticated') {
        // Find the "Login / Sign up" link inside the navigation header
        const loginMenuButton = document.querySelector('nav a[href="login.html"]');
        if (loginMenuButton) {
            // Swap the button text dynamically to show they are logged in!
            loginMenuButton.textContent = "Sign Out";
            loginMenuButton.style.borderBottom = "2px solid #ffcc00"; // Royal highlight accent
            
            // Allow them to sign out smoothly if they click it
            loginMenuButton.addEventListener('click', function(e) {
                e.preventDefault();
                localStorage.clear(); // Safely clear the login session data
                window.location.reload(); // Refresh the page to show guest state
            });
        }
    }
</script>
</body>

</html>
